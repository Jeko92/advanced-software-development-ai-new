<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Google Fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic"
    />

    <!-- CSS Reset -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
    />

    <!-- Milligram CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <!-- You should properly set the path from the main file. -->
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="row">
          <div class="column">
            <a href="index.html">
              <span class="logo">IT.Book.Library</span>
            </a>
          </div>
          <div class="column">
            <nav class="mainnav">
              <a href="index.html" class="mainnav-link mainnav-link--active"
                >Books</a
              >
              <a href="favorite.html" class="mainnav-link"
                >Favorites <span class="mainnav-number">0</span></a
              >
            </nav>
          </div>
        </div>
      </div>
    </header>
    <main class="container">
      <div class="title-row">
        <div class="title">
          <h1 id="book-title"></h1>
        </div>

        <button
          id="fav-btn"
          class="button-clear fav-detail-btn"
          title="Add to favorites"
          aria-label="Add to favorites"
        >
          <svg
            class="fav"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"
            />
          </svg>
        </button>
      </div>
      <section class="row">
        <div class="column column-67">
          <h3>Abstract</h3>
          <p id="book-abstract"></p>

          <h4>Details</h4>
          <ul id="book-details-list"></ul>

          <button
            class="button button-outline"
            onclick="location.href = 'index.html'"
          >
            Back
          </button>
        </div>
        <div class="column column-33">
          <img id="book-cover" src="" alt="" />
        </div>
      </section>
      <script type="module" src="./ts/detail.ts"></script>
    </main>
  </body>
</html>

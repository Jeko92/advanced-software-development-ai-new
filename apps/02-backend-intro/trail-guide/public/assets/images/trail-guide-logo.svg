<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Map Pin Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark Slate Inner Circle & Solid Teal Border (Transparent Canvas Outside) -->
  <circle cx="250" cy="250" r="230" fill="#142834" stroke="#00A896" stroke-width="12" />

  <!-- Orange Sun -->
  <circle cx="235" cy="180" r="62" fill="#F26419" />

  <!-- Left Mountain (Purplish Slate) -->
  <polygon points="90,360 210,190 280,360" fill="#3B4B74" />
  <polygon points="210,190 245,240 210,360" fill="#293656" opacity="0.6" />

  <!-- Right Mountain (Dark Forest Green) -->
  <polygon points="160,360 310,140 430,360" fill="#184D43" />

  <!-- Snow Cap -->
  <polygon points="310,140 295,185 308,175 325,195" fill="#FFFFFF" />

  <!-- Winding Trail Base -->
  <path d="M 285,195 C 298,225 262,245 262,275 C 262,305 278,335 248,395" 
        fill="none" stroke="#F4CA43" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trail Center Dashed Line -->
  <path d="M 285,195 C 298,225 262,245 262,275 C 262,305 278,335 248,395" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" />

  <!-- Red Map Pin -->
  <g filter="url(#shadow)">
    <path d="M 285,155 C 274,155 265,164 265,175 C 265,190 285,208 285,208 C 285,208 305,190 305,175 C 305,164 296,155 285,155 Z" fill="#F04D60" />
    <circle cx="285" cy="175" r="5" fill="#FFFFFF" />
  </g>

  <!-- Centered Main Title -->
  <text x="250" y="356" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="31" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="5">TRAIL GUIDE</text>

  <!-- Centered Subtitle (Moved Inward & Fully Readable) -->
  <text x="250" y="382" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        font-weight="600" 
        fill="#E2F1ED" 
        text-anchor="middle" 
        letter-spacing="3.5">EXPLORE THE OUTDOORS</text>
</svg>

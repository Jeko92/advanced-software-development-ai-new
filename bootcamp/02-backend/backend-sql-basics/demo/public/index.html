<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <title>Backend SQL Basics Demo</title>
  </head>
  <body>
    <main class="container">
      <h1>Backend SQL Basics Demo</h1>
      <p>
        This server reads blog postings from a SQLite database. Try the JSON
        API:
      </p>
      <ul>
        <li><code>GET /api/blogs</code> — all blog postings</li>
        <li><code>GET /api/blogs/:id</code> — a single blog posting</li>
      </ul>

  </body>

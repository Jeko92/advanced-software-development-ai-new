opencollection: 1.0.0

info:
  name: color-api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''

request:
  variables:
    - name: base_url
      value: localhost:3000
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: '{{base_url}}'
